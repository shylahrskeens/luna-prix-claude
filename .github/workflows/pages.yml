# Build Luna Prix and publish it to GitHub Pages.
#
# Nothing happens until Pages is switched on for the repository
# (Settings → Pages → Source: GitHub Actions), which needs the repo to be
# public on a free plan. Until then this workflow simply sits here.
name: Deploy to GitHub Pages

# Manual only for now. It ran once on push and failed at configure-pages
# because Pages is not enabled yet, which puts a red cross on the repository —
# not what a judge should see. Turn Pages on (Settings -> Pages -> Source:
# GitHub Actions, which needs a public repo on the free plan), then either run
# this from the Actions tab or put the push trigger back.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Typecheck, geometry, 21 headless races, finish check
        run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
