<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0c12" />
  <meta name="description" content="Luna Prix — an Axie kart racer. Three circuits, seven rivals, a rank to climb, and two bonus events." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Luna Prix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Lilita One stands in for the rounded heavy display face of Axie's own
       interface (the real one is not a published font); Nunito for text. -->
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Luna Prix" />
  <script>
    // Installable, and it starts without a network once it has been opened.
    // Never on a dev host: a worker there caches Vite's module URLs and serves
    // stale source for days. Any worker left over from before is removed.
    if ('serviceWorker' in navigator) {
      const dev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
      window.addEventListener('load', () => {
        if (dev) {
          navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
          if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k)));
          return;
        }
        navigator.serviceWorker.register('./sw.js').catch(() => { /* a plain browser tab is fine */ });
      });
    }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="stage"></canvas>
    <div id="screens" class="layer active interactive"></div>
    <div id="loading" class="loading">
      <div style="font-size:34px;font-weight:800;letter-spacing:-0.03em;background:linear-gradient(95deg,#c79bff,#5fd8e8);-webkit-background-clip:text;background-clip:text;color:transparent">LUNA PRIX</div>
      <div class="bar"><i></i></div>
      <div class="hint" id="loading-note">Building Lunacia…</div>
    </div>
  </div>
  <noscript>
    <div style="padding:40px;color:#eef1f8;font-family:system-ui">Luna Prix needs JavaScript and WebGL.</div>
  </noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
